<h1 appHighlight>vehicles list</h1>
<h6 appHighlight [color]="'blue'">available vehicles in table</h6>

<!-- SEARCH -->
<input type="text" [(ngModel)]="term" placeholder="search">

<button class="btn btn-primary" (click)="filterVehicles()">
  Filter
</button>

<table class="table table-dark table-bordered table-hovered">
  <thead>
    <tr>
      <th>id</th>
      <th>Vehicle</th>
      <th>Manufacturer</th>
      <th>model</th>
      <th>type</th>

      <!-- SORTING -->
      <th (click)="sortVehicles('fuel')">fuel</th>
      <th (click)="sortVehicles('color')">color</th>

      <th>image</th>
      <th>cost</th>
      <th>tyres</th>
      <th>Actions</th>
    </tr>
  </thead>

  <tbody>
    <tr *ngFor="let vehicle of vehicles">

      <td appHighlight>{{vehicle.id}}</td>
      <td>{{vehicle.Vehicle}}</td>
      <td>{{vehicle.manufacturer}}</td>
      <td>{{vehicle.model}}</td>
      <td>{{vehicle.type}}</td>
      <td>{{vehicle.fuel}}</td>
      <td>{{vehicle.color}}</td>
      <td>{{vehicle.image}}</td>
      <td>{{vehicle.cost}}</td>
      <td>{{vehicle.tyres}}</td>

      <td>
        <button (click)="deleteVehicle(vehicle.id)">delete</button>
      </td>

    </tr>
  </tbody>
</table>

<!-- PAGINATION -->
<button *ngFor="let x of [].constructor(10); let i=index"
(click)="pagedVehicles(i+1)">
{{i+1}}
</button>
